[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-research-hub"
version = "0.2.0"
description = "Noncommercial financial information, research metadata and rating-change workspace."
requires-python = ">=3.11"
license = "LicenseRef-Financial-Research-Hub-NC-1.0"
license-files = ["LICENSE", "NOTICE"]
readme = "README.md"
dependencies = []

[project.optional-dependencies]
ratings = ["yfinance>=1.8,<2"]
mcp = ["mcp==2.3.0"]

[project.scripts]
financial-research-hub = "finance_research_hub.cli:main"
financial-research-hub-mcp = "finance_research_hub.mcp_server:main"

[tool.setuptools.packages.find]
include = ["finance_research_hub*"]

[tool.setuptools.package-data]
finance_research_hub = ["static/*"]

